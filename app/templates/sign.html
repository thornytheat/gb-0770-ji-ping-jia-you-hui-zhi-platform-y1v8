<div class="double-book"><section class="panel"><h3>机坪加注证据单</h3>{% if runs %}<form id="signature"><label for="batch">交班批次</label><select id="batch">{% for run in runs %}<option value="{{ run.batch }}" {{ 'selected' if run.batch==current }}>{{ run.batch[:15] }} · {{ run.totals.difference_g|kg }} kg</option>{% endfor %}</select><button>签发交班证据</button></form>
<p><output id="checksum"></output></p><a id="export-slip" hidden>下载签发单</a>{% else %}<p>请先归档交班账。</p>{% endif %}</section>
<section class="panel"><h3>随件联单</h3><ul><li>量程选版与测量原件</li><li>签收比对与罐车收发</li><li>异常和未闭合库存</li></ul></section>
<section class="panel"><h3>晚到签收联补核</h3>{% if runs %}<form id="supplement"><label for="late-receipts">补交签收联 CSV（留空则调样例）</label><textarea id="late-receipts" rows="3" placeholder="ticket,truck,signed_kg,document"></textarea><button>入原班次对账</button></form>
<p><output id="supplement-result"></output></p><form id="recheck" hidden><button>签发补核结果</button></form>
<p><output id="recheck-checksum"></output></p><a id="export-recheck" hidden>下载补核单</a>
<p>补件只入原班次对账，不改原证据单；原单仍可复验。同一补件重试不重复核销，也不再签发。</p>{% else %}<p>请先归档并签发交班证据。</p>{% endif %}</section></div>
